name: Verify
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  relay-and-policy:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
      - run: npm ci --prefix server
      - run: npm ci --prefix cloudflare
      - run: npm test
      - run: npm run test:policy
      - run: npm run test:android-doubles
      - name: Generate tablet candidate documentation from the live MCP registry
        if: github.ref_name == 'charles-tablet-release'
        run: npm run docs:tools
      - run: npm run check:docs
      - name: Check generated tablet catalog against the versioned reference
        if: github.ref_name == 'charles-tablet-release'
        run: sha256sum -c docs/tablet-catalog.sha256
      - name: Preserve generated candidate tool reference
        if: github.ref_name == 'charles-tablet-release'
        uses: actions/upload-artifact@v4
        with:
          name: tablet-generated-tool-reference
          path: |
            docs/tools.json
            docs/tools-reference.md
          retention-days: 14
      - run: npm run test:cloud
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
      - name: Initialize the Android SDK toolchain
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
      - name: Install pinned Android SDK components
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Compile and lint the original Android source
        if: github.ref_name != 'charles-tablet-release'
        working-directory: android
        run: ./gradlew --no-daemon assembleRelease lintRelease
      - name: Compile and lint without release credentials
        if: github.ref_name == 'charles-tablet-release'
        working-directory: android
        run: ./gradlew --no-daemon compileReleaseJavaWithJavac lintRelease
      - name: Prove missing release key stops packaging
        if: github.ref_name == 'charles-tablet-release'
        working-directory: android
        shell: bash
        run: |
          set -euo pipefail
          unset CHARLES_RELEASE_KEYSTORE CHARLES_RELEASE_STORE_PASSWORD CHARLES_RELEASE_KEY_ALIAS CHARLES_RELEASE_KEY_PASSWORD
          if ./gradlew --no-daemon packageRelease > "$RUNNER_TEMP/unsigned-package.log" 2>&1; then
            echo "ERROR: unsigned packaging unexpectedly succeeded"
            exit 1
          fi
          grep -F "Release signing is not configured; no distribution artifact may be published." "$RUNNER_TEMP/unsigned-package.log"
          test ! -e app/build/outputs/apk/release/app-release.apk

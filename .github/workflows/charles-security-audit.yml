name: Charles security audit
on:
  push:
    branches: [charles-hover-0.19.1]
    paths:
      - 'server/package*.json'
      - '.github/workflows/charles-security-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: charles-security-audit-${{ github.ref }}
  cancel-in-progress: true
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
      - run: npm ci --prefix server
      - name: Audit current runtime dependencies (no automatic changes)
        working-directory: server
        shell: bash
        run: |
          set +e
          npm audit --omit=dev --json > ../security-audit.json
          result=$?
          node -e 'const fs=require("fs");const a=JSON.parse(fs.readFileSync("../security-audit.json"));console.log(JSON.stringify({metadata:a.metadata,vulnerabilities:a.vulnerabilities},null,2))'
          exit "$result"
      - name: Preserve evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: charles-security-audit
          path: security-audit.json
